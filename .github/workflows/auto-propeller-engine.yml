name: Autonomous Boat Propeller Pitch & Slip Sizing Engine

on:
  schedule:
    - cron: '14 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_prop:
        description: 'Optional Outboard or Propeller Spec (e.g. Yamaha F150 17 Pitch or Mercury 115 Pro XS)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-propeller-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Propeller Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_PROP: ${{ github.event.inputs.custom_prop || '' }}
        run: |
          python engine/propeller_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_propellers.json
          if git diff --staged --quiet; then
            echo "No new propeller calculator pages to commit."
          else
            git commit -m "chore(propeller): auto-publish new boat propeller pitch & slip calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
